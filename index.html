<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIB // DOWNLOADER</title>
    <style>
        body { background-color: #0f0f13; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; width: 100%; max-width: 500px; padding: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #1a1a24; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #db2777; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #be185d; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ZIB // DOWNLOADER</h2>
        <input type="text" id="urlInput" placeholder="YouTube video linkini yapıştır...">
        <button onclick="startDownload()">İndirmeyi Başlat</button>
    </div>

    <script>
        function startDownload() {
            const url = document.getElementById('urlInput').value;
            if (!url) return alert('Lütfen bir link girin!');
            window.location.href = `/download?url=${encodeURIComponent(url)}`;
        }
    </script>
</body>
</html>
